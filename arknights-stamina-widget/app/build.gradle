plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arknights.stamina'
    compileSdk 35

    defaultConfig {
        applicationId "com.arknights.stamina"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // 个人侧载用同一调试密钥即可安装
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }
}

// 本项目刻意零外部运行时依赖：仅使用 Android 框架 API（HttpURLConnection + org.json + 系统加密），
// 便于离线构建与侧载，APK 体积最小。
